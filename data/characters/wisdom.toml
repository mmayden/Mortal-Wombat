# ---------------------------------------------------------------------------
#  Jump attack — DESIGN.md 4.5
#
#  The table gives active as "until landing" and recovery as "4 (landing)".
#  The schema has no way to express "until landing" -- durations are integers --
#  so active is written as the airborne remainder of a 44-frame jump after 6
#  frames of startup. When jumping is implemented, the sim will need to end the
#  active window on ground contact regardless of this number; that is a sim
#  rule, not a data one.
# ---------------------------------------------------------------------------

[moves.jump_attack]
input     = "U+HP"
startup   = 6
active    = 34
recovery  = 4
damage    = 7
hitstun   = 16
blockstun = 11

[[moves.jump_attack.hitboxes]]
# Low and forward, NOT up at head height like the standing normals.
#
# A jumping fighter carries its whole body upward, hitbox included. Authored at
# standing-punch height (y = -96) this box floated above the opponent's head for
# the entire arc: a sweep of 208 combinations of range and timing produced zero
# connections. The attack was unusable and nothing caught it, because the jump
# replay asserted that the fighter got airborne and threw the move -- not that
# it ever touched anyone.
#
# Reaching from just above the feet to slightly below them is what makes an
# air-to-ground attack land while descending, which is when a jump-in is
# supposed to be a threat.
frames = [7, 40]
x = 10
y = -34
w = 44
h = 44

# ---------------------------------------------------------------------------
#  Special — DESIGN.md 4.5, input B,F+HP (4.5, chosen over a quarter-circle)
#
#  The table leaves active blank, which reads like a projectile. DESIGN.md 4.6
#  does not settle it either way, and MAX_PROJECTILES in constants.h carries the
#  same open question. Written here as a long-reaching strike, which is the
#  reading that requires no system that does not exist yet.
# ---------------------------------------------------------------------------

[moves.special]
input     = "B,F+HP"
startup   = 12
active    = 4
recovery  = 24
damage    = 6
hitstun   = 18
blockstun = 12

[[moves.special.hitboxes]]
frames = [13, 16]
x = 20
y = -104
w = 60
h = 30
