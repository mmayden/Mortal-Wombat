# ---------------------------------------------------------------------------
#  Crouching variants — DESIGN.md 4.5: "inherit, adjusted boxes"
#
#  Timings are identical to the standing versions by that instruction. Only the
#  boxes move: lower, and shorter in reach for the punches.
# ---------------------------------------------------------------------------

[moves.crouch_low_punch]
input            = "D+LP"
startup          = 4
active           = 2
recovery         = 8
damage           = 3
hitstun          = 12
blockstun        = 8
