name: CI

on:
  pull_request:
  push:
    branches: [main]

  # Weekly, to catch rot rather than changes.
  #
  # Almost everything this build depends on lives outside the repository: SDL3,
  # doctest and tomlplusplus are fetched at configure time, the runner images
  # update continuously, and the actions themselves get deprecated on their own
  # schedule. A repo can go green-to-red without a single commit, and on a
  # project with long quiet stretches the alternative is discovering it while
  # trying to ship something else.
  schedule:
    - cron: '0 6 * * 1'

  # So a red scheduled run can be re-checked without an empty commit.
  workflow_dispatch:

# A new push supersedes an in-flight run on the same branch. Agent branches
# push often, and a queue of stale runs is a queue nobody reads.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache

jobs:
  # -------------------------------------------------------------------------
  # Build and test on all three platforms.
  #
  # The whole suite has to stay under five minutes (ADR 0010). Past that,
  # people start skipping it, and a skipped gate is not a gate.
  # -------------------------------------------------------------------------
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false          # a Windows-only failure is exactly the signal
      matrix:                   # this project most needs to see
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v6

      # SDL3 refuses to configure on Linux without the X11/Wayland development
      # headers, and the runner image ships none of them.
      #
      # This is SDL3's documented build-dependency set rather than the minimum
      # that makes configure pass. Trimming it turns into whack-a-mole -- the
      # first attempt here installed X11 and then failed on XTEST -- and every
      # round trip is a CI run. The packages cost seconds; the iterations do
      # not.
      #
      # Installed rather than setting SDL_UNIX_CONSOLE_BUILD, which would
      # configure and go green while producing an SDL that cannot open a
      # window. The Linux job is one of the three the desync comparison
      # depends on (ADR 0011), and that comparison only means something if
      # each platform built the same game.
      - name: Install SDL3 build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxfixes-dev libxss-dev libxtst-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols libdecor-0-dev \
            libdrm-dev libgbm-dev \
            libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev \
            libasound2-dev libpulse-dev \
            libdbus-1-dev libudev-dev libibus-1.0-dev

      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Cache CPM packages
        uses: actions/cache@v4
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: cpm-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: cpm-${{ runner.os }}-

      - name: Configure
        run: cmake --preset debug

      - name: Build
        run: cmake --build --preset debug

      - name: Test
        run: ctest --preset debug --output-on-failure

      # Boots the actual game binary -- window, renderer, event pump, and the
      # fixed-timestep loop -- not just the simulation.
      #
      # BLUEPRINT.md 1.3 asks the smoke test to boot the game headless and run
      # 600 ticks. The ctest smoke tier covers the sim, which has no platform
      # dependency at all, so until this step existed nothing verified that the
      # binary could start. SDL's dummy video driver makes that possible on a
      # runner with no display.
      #
      # 600 sim frames is 10 seconds of game time, and the loop paces itself in
      # real time, so expect this step to take about that long.
      - name: Headless game boot
        run: ./build/debug/bin/divided_states --frames 600
        shell: bash
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy

      # Proves the session recorder produces files the replay tooling can
      # actually read and reproduce -- not merely that it writes something.
      #
      # tests/replays/idle.replay is 300 frames of no input from the same seed
      # the game boots with, recorded by ds_replay_record. A --record run of the
      # same length must therefore agree on every hash. If the game and the test
      # tooling ever disagree about frame numbering or when a checkpoint is
      # taken, the recordings a player sends in stop reproducing, and this is
      # the only thing that would notice.
      - name: Session recorder round-trips through the replay format
        run: |
          ./build/debug/bin/divided_states --frames 300 --record recorded.replay
          grep -E '^(checkpoint|final) ' recorded.replay > recorded-hashes.txt
          grep -E '^(checkpoint|final) ' tests/replays/idle.replay > expected-hashes.txt
          diff -u expected-hashes.txt recorded-hashes.txt
        shell: bash
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy

      # Uploaded so a desync failure below can be inspected without a rerun.
      - name: Record state hash trace
        run: ./build/debug/bin/ds_desync_probe > desync-${{ runner.os }}.txt
        shell: bash

      - name: Upload state hash trace
        uses: actions/upload-artifact@v7
        with:
          name: desync-${{ runner.os }}
          path: desync-${{ runner.os }}.txt
          retention-days: 7

  # -------------------------------------------------------------------------
  # Release build, and determinism across optimization levels.
  #
  # Everything else in this workflow builds Debug. Until this job existed, the
  # release configuration had never been compiled anywhere -- so an optimized
  # build could have failed, or worse, behaved differently, and nobody would
  # have known until it was time to ship.
  #
  # The second half matters more than the first. The simulation is integer-only
  # by construction (ADR 0002), so optimization SHOULD NOT change its results --
  # but "should not" is exactly the class of claim this project checks rather
  # than assumes, and a divergence here would mean the sim depends on something
  # the optimizer is free to alter.
  #
  # Linux only, deliberately. The three-platform matrix already covers codegen
  # differences between compilers; this covers optimization level, which is
  # orthogonal, and running it everywhere would double CI time to re-answer the
  # same question.
  # -------------------------------------------------------------------------
  release:
    name: release build + determinism across -O levels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v6

      - name: Install SDL3 build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxfixes-dev libxss-dev libxtst-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols libdecor-0-dev \
            libdrm-dev libgbm-dev \
            libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev \
            libasound2-dev libpulse-dev \
            libdbus-1-dev libudev-dev libibus-1.0-dev

      - name: Cache CPM packages
        uses: actions/cache@v4
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: cpm-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: cpm-${{ runner.os }}-

      - name: Configure and build both configurations
        run: |
          cmake --preset debug
          cmake --build --preset debug
          cmake --preset release
          cmake --build --preset release

      - name: Test release
        run: ctest --preset release --output-on-failure

      - name: Compare state hashes across optimization levels
        run: |
          ./build/debug/bin/ds_desync_probe   > trace-debug.txt
          ./build/release/bin/ds_desync_probe > trace-release.txt

          for f in trace-debug.txt trace-release.txt; do
            if [ ! -s "$f" ]; then
              echo "::error::$f is empty -- the probe produced no output, so this"
              echo "::error::check would otherwise pass vacuously."
              exit 1
            fi
          done

          if diff -q trace-debug.txt trace-release.txt > /dev/null; then
            echo "OK: release and debug simulate identically"
            exit 0
          fi

          echo "::error::Release and Debug simulations diverge."
          echo ""
          diff trace-debug.txt trace-release.txt | head -20
          echo ""
          echo "The simulation is integer-only, so optimization must not change"
          echo "its results. A divergence here means it depends on something the"
          echo "optimizer is allowed to alter: undefined behaviour, an"
          echo "uninitialized read, or a signed-overflow assumption. Run the"
          echo "debug build under ASan and UBSan first."
          exit 1

  # -------------------------------------------------------------------------
  # The desync check. ADR 0011 calls this the most important test in the
  # project, and it is the reason this repo runs a three-platform matrix at
  # all rather than building on Linux alone.
  #
  # Cross-platform divergence is the failure that ships broken: it cannot be
  # reproduced on the developer's machine, it cannot be debugged from a bug
  # report, and by the time two real players see it the commit that caused it
  # is months old. The only workable place to catch it is the commit itself.
  # -------------------------------------------------------------------------
  desync:
    name: desync (cross-platform state hashes)
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: desync-*
          merge-multiple: true

      - name: Compare per-frame state hashes across platforms
        shell: bash
        run: |
          set -uo pipefail

          for f in desync-Linux.txt desync-Windows.txt desync-macOS.txt; do
            if [ ! -s "$f" ]; then
              echo "::error::$f is missing or empty -- the probe produced no"
              echo "::error::output, so this check would otherwise pass vacuously."
              exit 1
            fi
          done

          status=0
          for other in desync-Windows.txt desync-macOS.txt; do
            if diff -q desync-Linux.txt "$other" > /dev/null; then
              echo "OK: $other matches Linux"
              continue
            fi

            status=1
            echo "::error::DESYNC -- $other diverges from Linux."
            echo ""
            echo "First differing lines (frame number, then state hash):"
            diff desync-Linux.txt "$other" | head -20
            echo ""
            echo "Each line is one simulation frame. The first differing frame is"
            echo "where the two platforms stopped agreeing -- look at what that"
            echo "frame does. The usual causes, in order: a float below the sim"
            echo "boundary, iteration over an unordered container, uninitialized"
            echo "padding in GameState, or a struct laid out differently by the"
            echo "two compilers (compare the sizeof line at the top of each file)."
            echo ""
            echo "See docs/ARCHITECTURE.md section 1 and ADR 0002."
          done

          exit $status

  # -------------------------------------------------------------------------
  # The sim boundary check, run once. It is also a ctest case, but running it
  # standalone means a boundary violation reports as its own failed job rather
  # than as one line inside a test log.
  # -------------------------------------------------------------------------
  boundary:
    name: sim boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tests/check_sim_boundary.py src/sim

  # -------------------------------------------------------------------------
  # Formatting. Blocking, because it is now deterministic.
  #
  # The version is pinned. clang-format changes its output between releases,
  # so an unpinned check goes red the day a runner image updates, for reasons
  # nobody caused -- and that is precisely how people learn to ignore CI.
  # Pinned, the only way this fails is an unrun formatter: a ten-second fix.
  #
  # Keep in step with CONVENTIONS.md section 9, which tells developers to
  # install this same version locally.
  # -------------------------------------------------------------------------
  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned clang-format
        run: pip install clang-format==22.1.8
      - name: Check formatting
        run: |
          find src tests \( -name '*.h' -o -name '*.cpp' \) -print0 \
            | xargs -0 clang-format --dry-run --Werror
